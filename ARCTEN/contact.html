<!DOCTYPE html>
<html lang="en">
<head>...</head>
<body>
    <!-- Navbar -->
    ...
    <section class="contact-page">
        <div class="container">
            <div class="contact-grid">
                <div class="contact-info">
                    <h2>GET IN TOUCH</h2>
                    <p>Our team is ready to assist you with any questions about our products or your order.</p>
                    <div class="contact-details">
                        <div><i class="fas fa-envelope"></i> hello@arcten.com</div>
                        <div><i class="fas fa-phone"></i> +1 (800) 555-0199</div>
                        <div><i class="fas fa-map-marker-alt"></i> 101 Arctic Avenue, New York, NY 10001</div>
                    </div>
                </div>
                <form class="contact-form" id="contactForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Your name" required />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Your email" required />
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" placeholder="Subject" />
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="5" placeholder="Your message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">SEND MESSAGE</button>
                    <div id="formStatus"></div>
                </form>
            </div>
        </div>
    </section>
    <!-- Footer -->
    ...
    <script src="js/main.js"></script>
</body>
</html>
